name: Validate public KB

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_kb.py .
      - run: python -m unittest discover -s tests -v
      - run: npm --prefix site ci --no-audit --no-fund
      - run: npm --prefix site run build
      - name: Check deterministic metadata
        run: git diff --exit-code -- content/catalog.md content/timeline.md content/project/review-queue.md content/regions data/metadata data/source-registry.yaml ai/index
