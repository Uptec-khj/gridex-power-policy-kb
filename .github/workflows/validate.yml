name: Validate public KB

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_kb.py .
      - run: python -m unittest discover -s tests -v
      - run: npm --prefix site ci --no-audit --no-fund
      - run: npm --prefix site run build
      - name: Check deterministic metadata
        run: git diff --exit-code -- content/catalog.md content/timeline.md content/project/review-queue.md content/regions data/metadata data/source-registry.yaml ai/index
