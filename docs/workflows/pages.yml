name: Validate and publish GRIDEX

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gridex-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: python -m pip install -r requirements.txt
      - run: python scripts/validate_kb.py .
      - run: python -m unittest discover -s tests -v
      - run: python scripts/kb.py build
      - run: npm --prefix site ci --no-audit --no-fund
      - run: npm --prefix site run build
      - run: node scripts/check-site.mjs
      - name: Check generated indexes are committed
        run: git diff --exit-code -- content/catalog.md content/timeline.md content/project/review-queue.md content/regions data/metadata data/source-registry.yaml ai/index
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/public
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
