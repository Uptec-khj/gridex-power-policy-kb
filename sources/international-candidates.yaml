# Planning inventory only. Not consumed by collector or the operational registry.
schema_version: 'proposal-1'
research_cutoff: '2026-09-11'
status: proposed
enabled: false
roadmap: https://github.com/Uptec-khj/gridex-project-management/blob/main/content/international-roadmap.md
defaults:
  collection_feasibility: untested
  robots_review: pending
  rights_review: pending
  public_original_archive: blocked_pending_rights_review
  discovery_preference: [official_api_or_feed_if_available, official_listing, manual_registration]
